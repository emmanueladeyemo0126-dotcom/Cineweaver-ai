<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="url(#borderGlow)" stroke-width="4" fill="none"/>
  
  <defs>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#e11d48" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b"/>
      <stop offset="0.5" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Cinema Clapperboard / Film Frame -->
  <g transform="translate(96, 116)">
    <!-- Base Board -->
    <rect x="0" y="80" width="320" height="200" rx="20" fill="#18181b" stroke="#f59e0b" stroke-width="6"/>
    <!-- Top Clapper Arm -->
    <path d="M0 60 L320 10 L320 60 L0 60 Z" fill="#27272a"/>
    <!-- Clapper Stripes -->
    <path d="M40 54 L70 49 L55 60 L25 60 Z" fill="#fbbf24"/>
    <path d="M110 43 L140 38 L125 60 L95 60 Z" fill="#fbbf24"/>
    <path d="M180 32 L210 27 L195 60 L165 60 Z" fill="#fbbf24"/>
    <path d="M250 21 L280 16 L265 60 L235 60 Z" fill="#fbbf24"/>
    
    <!-- Anamorphic Camera Lens Circle -->
    <circle cx="160" cy="180" r="64" fill="url(#lensGrad)" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="160" cy="180" r="42" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>
    <circle cx="160" cy="180" r="22" fill="#f59e0b" opacity="0.9"/>
    <!-- Shutter iris blades -->
    <path d="M160 138 L170 170 L150 170 Z" fill="#67e8f9" opacity="0.5"/>
    <path d="M198 160 L170 175 L170 155 Z" fill="#67e8f9" opacity="0.5"/>
  </g>
  <!-- Text CineWeaver -->
  <text x="256" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#fbbf24">CINEWEAVER</text>
</svg>
